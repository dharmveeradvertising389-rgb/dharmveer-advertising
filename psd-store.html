<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSD Store | धर्मवीर ॲडव्हर्टायझिंग</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans Devanagari', sans-serif; }
    body { background-color: #0b0b0b; color: #ffffff; min-height: 100vh; padding-bottom: 50px; }

    /* Header */
    .store-header {
      display: flex; justify-content: space-between; align-items: center; padding: 15px 5%;
      background: rgba(15, 15, 15, 0.95); border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(10px);
    }
    .store-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; }
    .store-brand img { height: 42px; width: auto; }
    .back-btn { background: rgba(255, 102, 0, 0.15); color: #ff6600; border: 1px solid #ff6600; padding: 8px 18px; border-radius: 20px; text-decoration: none; font-size: 14px; font-weight: 600; }

    .store-hero { text-align: center; padding: 30px 20px 10px; }
    .store-hero h1 { font-size: 30px; }
    .store-hero h1 span { color: #ff6600; }

    /* Sector Styling */
    .sector-block { max-width: 1200px; margin: 35px auto; padding: 0 20px; }
    .sector-title { font-size: 20px; color: #ff6600; margin-bottom: 15px; border-bottom: 1px solid rgba(255,102,0,0.3); padding-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }

    /* Horizontal Scroll Flex Container */
    .scroll-grid {
      display: flex; gap: 20px; overflow-x: auto; scroll-behavior: smooth; padding-bottom: 10px;
    }
    .scroll-grid::-webkit-scrollbar { height: 6px; }
    .scroll-grid::-webkit-scrollbar-thumb { background: #ff6600; border-radius: 10px; }

    /* PSD Cards */
    .psd-card {
      min-width: 280px; max-width: 320px; background: #141414; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; overflow: hidden; flex-shrink: 0; transition: transform 0.3s;
    }
    .single-card { min-width: 100%; max-width: 100%; } /* Single Item Banner View */

    .psd-card:hover { transform: translateY(-5px); border-color: #ff6600; }

    .psd-img-box { height: 240px; width: 100%; background: #1e1e1e; overflow: hidden; cursor: pointer; }
    .psd-img-box img { width: 100%; height: 100%; object-fit: cover; }

    .psd-details { padding: 16px; }
    .psd-details h3 { font-size: 16px; margin-bottom: 8px; color: #fff; }
    
    .price-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .price-main { font-size: 20px; font-weight: bold; color: #ff6600; }
    .price-orig { font-size: 13px; color: #777; text-decoration: line-through; margin-left: 6px; }

    .btn-buy { background: #ff6600; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; }
    .btn-share { background: rgba(255,255,255,0.1); color: #fff; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }

    /* Payment Modal */
    .pay-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); align-items: center; justify-content: center; z-index: 10000; }
    .pay-modal.active { display: flex; }
    .pay-card { background: #181818; border: 1px solid #ff6600; padding: 22px; border-radius: 16px; width: 90%; max-width: 360px; text-align: center; }
  </style>
</head>
<body>

  <header class="store-header">
    <a href="index.html" class="store-brand">
      <img src="assets/logo.png" alt="Logo" onerror="this.style.display='none'">
      <strong>धर्मवीर ॲडव्हर्टायझिंग</strong>
    </a>
    <a href="index.html" class="back-btn">← Back to Home</a>
  </header>

  <div class="store-hero">
    <h1>प्रीमियम <span>PSD Store</span></h1>
  </div>

  <div id="mainStoreContent">
    <p style="text-align:center; padding: 30px; color:#aaa;">स्टोअर लोड होत आहे...</p>
  </div>

  <!-- QR Payment Popup -->
  <div class="pay-modal" id="payModal">
    <div class="pay-card">
      <h3 id="payTitle">PSD Name</h3>
      <p style="margin:10px 0; color:#ff6600; font-weight:bold; font-size: 22px;" id="payPrice">₹0</p>
      
      <div style="background:#fff; padding:10px; border-radius:10px; display:inline-block;">
        <img id="qrImage" src="" style="width:170px; height:170px; display:block;">
      </div>
      
      <p style="font-size:12px; color:#aaa; margin:12px 0 6px;">QR कोड स्कॅन करा किंवा UPI ID कॉपी करा:</p>
      <button onclick="navigator.clipboard.writeText('9309860089@ybl'); alert('UPI ID कॉपी झाला!');" style="background:#0b0b0b; color:#fff; border:1px dashed #ff6600; padding:8px 14px; border-radius:6px; cursor:pointer; font-size:13px; width: 100%;">Copy UPI: 9309860089@ybl</button>

      <a id="waLink" href="#" target="_blank" style="display:block; background:#25D366; color:#fff; padding:10px; border-radius:8px; text-decoration:none; font-weight:bold; margin-top:12px; font-size:14px;">WhatsApp वर स्क्रीनशॉट पाठवा →</a>
      <button onclick="document.getElementById('payModal').classList.remove('active')" style="background:transparent; color:#888; border:none; margin-top:12px; cursor:pointer; font-size:13px;">रद्द करा</button>
    </div>
  </div>

  <script>
    const waNum = "919309860089";
    const UPI_ID = "9309860089@ybl";

    async function fetchStoreData() {
      try {
        const res = await fetch('/api/psd-store');
        const data = await res.json();
        renderStore(data);
      } catch (e) {
        document.getElementById('mainStoreContent').innerHTML = "<p style='text-align:center;'>डेटा लोड करण्यात अडचण आली.</p>";
      }
    }

    function renderStore(data) {
      const container = document.getElementById('mainStoreContent');
      container.innerHTML = '';

      if (!data || data.length === 0) {
        container.innerHTML = "<p style='text-align:center; color:#888;'>सध्या कोणतीही PSD उपलब्ध नाही.</p>";
        return;
      }

      data.forEach(sec => {
        if (!sec.items || sec.items.length === 0) return;

        const secBlock = document.createElement('div');
        secBlock.className = 'sector-block';

        const isSingle = sec.items.length === 1;

        let cardsHtml = sec.items.map(item => `
          <div class="psd-card ${isSingle ? 'single-card' : ''}" id="${item.id}">
            <div class="psd-img-box" onclick="openPay('${item.title}', '${item.price}')">
              <img src="${item.previewImg}" alt="${item.title}" onerror="this.src='assets/logo.png'">
            </div>
            <div class="psd-details">
              <h3>${item.title}</h3>
              <div class="price-row">
                <div>
                  <span class="price-main">₹${item.price}</span>
                  <span class="price-orig">₹${item.originalPrice}</span>
                </div>
                <div>
                  <button class="btn-buy" onclick="openPay('${item.title}', '${item.price}')">खरेदी करा →</button>
                  <button class="btn-share" onclick="copyLink('${item.id}')">🔗</button>
                </div>
              </div>
            </div>
          </div>
        `).join('');

        secBlock.innerHTML = `
          <h2 class="sector-title">${sec.sectionTitle}</h2>
          <div class="${isSingle ? '' : 'scroll-grid'}">${cardsHtml}</div>
        `;

        container.appendChild(secBlock);
      });
    }

    function openPay(title, price) {
      document.getElementById('payTitle').innerText = title;
      document.getElementById('payPrice').innerText = `₹${price}`;
      document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=${UPI_ID}%26pn=DharmveerAdvertising%26am=${price}%26cu=INR`;
      document.getElementById('waLink').href = `https://wa.me/${waNum}?text=${encodeURIComponent('नमस्कार, मी ' + title + ' (₹' + price + ') साठी पेमेंट केले आहे.')}`;
      document.getElementById('payModal').classList.add('active');
    }

    function copyLink(id) {
      navigator.clipboard.writeText(`${window.location.origin}${window.location.pathname}?id=${id}`).then(() => alert("लिंक कॉपी झाली!"));
    }

    window.onload = fetchStoreData;
  </script>
</body>
</html>
