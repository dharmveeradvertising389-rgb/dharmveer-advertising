  <!-- =========================

  <div

      id="lightboxImg"

      alt="Full Preview">

  </div>


  <script>

    const waNum = "919309860089";
    const UPI_ID = "9309860089@ybl";


    /* =========================
       FETCH PSD DATA
    ========================== */

    async function fetchStoreData() {

      try {

        const res = await fetch('/api/psd-store');

        const data = await res.json();

        renderStore(data);

      } catch (e) {

        document.getElementById('storeMain').innerHTML =
          "<p style='text-align:center;'>डेटा लोड करण्यात अडचण आली.</p>";

      }

    }


    /* =========================
       RENDER STORE
    ========================== */

    function renderStore(data) {

      const container =
        document.getElementById('storeMain');

      container.innerHTML = '';


      if (!data || data.length === 0) {

        container.innerHTML =
          "<p style='text-align:center; color:#94a3b8;'>सध्या कोणतीही PSD उपलब्ध नाही.</p>";

        return;
      }


      /* =========================
         HERO
      ========================== */

      const hero = document.createElement('section');

      hero.className = 'store-hero';

      hero.innerHTML = `

        <img
          src="assets/logo.png"
          alt="धर्मवीर ॲडव्हर्टायझिंग"
          class="hero-logo"
          onerror="this.style.display='none'">


        <div class="hero-label label-creative">
          <span>✦</span> Creative
        </div>


        <div class="hero-label label-branding">
          <span>◇</span> Branding
        </div>


        <div class="hero-label label-marketing">
          <span>↗</span> Marketing
        </div>


        <div class="hero-bottom">

          <div class="hero-main-line">
            CREATIVE DESIGN • DIGITAL MARKETING
          </div>

          <div class="hero-sub-line">
            Premium PSD Templates
          </div>

        </div>

      `;

      container.appendChild(hero);


      /* =========================
         PSD SECTIONS
      ========================== */

      data.forEach((sec, idx) => {

        if (!sec.items || sec.items.length === 0) {
          return;
        }


        const secBlock =
          document.createElement('div');

        secBlock.className =
          'section-block';


        const isSingle =
          sec.items.length === 1;


        let cardsHtml =
          sec.items.map(item => {

            const discount =
              item.originalPrice &&
              Number(item.originalPrice) >
              Number(item.price)

              ? Math.round(
                  (
                    (item.originalPrice - item.price) /
                    item.originalPrice
                  ) * 100
                ) + '%Off'

              : '';


            const itemUrl =
              window.location.origin +
              window.location.pathname +
              '#' +
              item.id;


            return `

              <div
                class="${isSingle ? 'single-card-banner' : 'compact-card'}"
                id="${item.id}">


                <div
                  class="img-container"
                  onclick="openImageLightbox('${escapeHtml(item.previewImg)}')">

                  <img
                    src="${item.previewImg}"
                    alt="${escapeHtml(item.title)}"
                    onerror="this.src='assets/logo.png'">

                </div>


                <div class="card-info">

                  <div>

                    <h3>
                      ${escapeHtml(item.title)}
                    </h3>


                    <div class="price-details">

                      <div>

                        <span class="price-current">
                          ₹${item.price}
                        </span>

                        <span class="price-old">
                          ₹${item.originalPrice}
                        </span>

                      </div>


                      ${
                        discount
                        ?
                        `<span class="discount-tag">${discount}</span>`
                        :
                        ''
                      }

                    </div>

                  </div>


                  <div class="action-row">

                    <button
                      class="btn-action"
                      onclick="openPay(
                        '${escapeHtml(item.title)}',
                        '${item.price}',
                        '${escapeHtml(item.downloadUrl || '')}'
                      )">

                      Get it Now →

                    </button>


                    <div
                      class="link-circle"
                      title="या PSD ची लिंक कॉपी करा"
                      onclick="copyItemLink('${itemUrl}')">

                      🔗

                    </div>

                  </div>

                </div>

              </div>

            `;

          }).join('');


        secBlock.innerHTML = `

          <div class="section-header">
            ${escapeHtml(sec.sectionTitle)}
          </div>


          <div
            class="${isSingle ? '' : 'multi-cards-grid'}"
            id="scroll_grid_${idx}">

            ${cardsHtml}

          </div>


          ${
            !isSingle
            ?

            `

              <div class="scroll-controls">

                <button
                  class="nav-arrow"
                  onclick="scrollGrid(${idx}, -220)">
                  ←
                </button>


                <button
                  class="nav-arrow"
                  onclick="scrollGrid(${idx}, 220)">
                  →
                </button>

              </div>

            `

            :

            ''
          }

        `;


        container.appendChild(secBlock);

      });


      /* =========================
         NEW: DIRECT PSD HASH LINK
         ========================= */

      scrollToHashItem();

    }


    /* =========================
       NEW: DIRECT PSD SCROLL
    ========================= */

    function scrollToHashItem() {

      const hash = window.location.hash;

      if (!hash) {
        return;
      }

      const itemId = decodeURIComponent(
        hash.substring(1)
      );

      if (!itemId) {
        return;
      }

      const target =
        document.getElementById(itemId);

      if (!target) {
        return;
      }

      const rect =
        target.getBoundingClientRect();

      const isVisible =
        rect.top >= 0 &&
        rect.bottom <= window.innerHeight;

      /*
        PSD आधीच screen वर दिसत असेल तर
        कोणताही scroll करू नये.
      */

      if (isVisible) {
        return;
      }

      /*
        PSD screen वर नसेल तर
        फक्त त्या PSD card पर्यंत scroll.
      */

      window.scrollTo({
        top:
          window.pageYOffset +
          rect.top -
          25,
        behavior: 'smooth'
      });

    }


    /* =========================
       NEW: HASH CHANGE
    ========================== */

    window.addEventListener('hashchange', function() {

      scrollToHashItem();

    });


    /* =========================
       IMAGE LIGHTBOX
    ========================== */

    function openImageLightbox(imgSrc) {

      document.getElementById('lightboxImg').src =
        imgSrc;

      document
        .getElementById('imageModal')
        .classList.add('active');

    }


    function closeModalOutside(event, modalId) {

      document
        .getElementById(modalId)
        .classList.remove('active');

    }


    /* =========================
       COPY PSD LINK
    ========================== */

    function copyItemLink(url) {

      navigator.clipboard
        .writeText(url)
        .then(() => {

          alert(
            "या PSD ची डायरेक्ट लिंक कॉपी झाली! 🔗\nआता तुम्ही ती WhatsApp किंवा Instagram वर पेस्ट करू शकता."
          );

        })
        .catch(() => {

          alert(
            "लिंक कॉपी करताना अडचण आली."
          );

        });

    }


    /* =========================
       SCROLL PSD
    ========================== */

    function scrollGrid(idx, dist) {

      const grid =
        document.getElementById(
          `scroll_grid_${idx}`
        );

      if (grid) {

        grid.scrollBy({
          left: dist,
          behavior: 'smooth'
        });

      }

    }


    /* =========================
       PAYMENT
    ========================= */

    function openPay(title, price, downloadUrl) {

      document.getElementById('payTitle')
        .innerText = title;


      document.getElementById('payPrice')
        .innerText = `₹${price}`;


      document.getElementById('qrImage').src =
        `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=${UPI_ID}%26pn=DharmveerAdvertising%26am=${price}%26cu=INR`;


      document.getElementById('waLink').href =
        `https://wa.me/${waNum}?text=${
          encodeURIComponent(

            title +

            price +
            ') साठी पेमेंट केले आहे.'
          )
        }`;


      /* =========================
         NEW: FREE PSD LINK
         ========================= */

      const freePsdLink =
        document.getElementById('freePsdLink');


      /*
        downloadUrl रिकामा किंवा "#"

      */

      if (
        downloadUrl &&
        downloadUrl.trim() !== '' &&
        downloadUrl.trim() !== '#'
      ) {

        freePsdLink.href =
          downloadUrl.trim();

        freePsdLink.style.display =

      } else {

        freePsdLink.href =
          '#';

        freePsdLink.style.display =
          'none';

      }


      document
        .getElementById('payModal')
        .classList.add('active');

    /* =========================
       HTML ESCAPE
    ========================== */

    function escapeHtml(str) {

      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

    }

    ========================== */

    window.onload = fetchStoreData;
