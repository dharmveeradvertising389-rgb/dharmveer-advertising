<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSD Store | धर्मवीर ॲडव्हर्टायझिंग</title>
  
  <!-- Favicon Tab Logo -->
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans Devanagari', sans-serif; }

    body {
      background-color: #121212;
      color: #ffffff;
      min-height: 100vh;
      padding: 20px 15px;
    }

    /* Top Navigation Header */
    .top-bar {
      max-width: 1100px;
      margin: 0 auto 20px;
      display: flex;
      justify-content: flex-end;
    }

    .btn-back {
      background: #ff5500;
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    .btn-back:hover { opacity: 0.9; }

    /* Store Main Layout */
    .store-container {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 30px;
      align-items: start;
    }

    /* Left Branding Sidebar */
    .brand-sidebar {
      text-align: center;
      padding: 20px 10px;
      position: sticky;
      top: 20px;
    }

    .brand-logo-img {
      width: 220px;
      height: auto;
      margin: 0 auto 15px;
      display: block;
      filter: drop-shadow(0px 8px 20px rgba(255, 85, 0, 0.3));
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .brand-subtitle {
      font-size: 14px;
      color: #cbd5e1;
      font-weight: 500;
    }

    /* Right Products Content Area */
    .products-content { width: 100%; min-width: 0; }

    .section-block { margin-bottom: 35px; }
    
    .section-header {
      font-size: 16px;
      color: #cbd5e1;
      font-weight: 500;
      margin-bottom: 12px;
      text-align: center;
    }

    /* Smart Dynamic Cards Grid */
    .multi-cards-grid {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 10px;
    }
    .multi-cards-grid::-webkit-scrollbar { display: none; }

    /* Single Item: Large Banner View */
    .single-card-banner {
      background: #ffffff;
      color: #1e293b;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    .single-card-banner .img-container {
      width: 100%;
      height: 280px;
      background: #000;
      overflow: hidden;
    }

    .single-card-banner .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Multiple Items: Small Compact White Cards */
    .compact-card {
      min-width: 210px;
      max-width: 220px;
      background: #ffffff;
      color: #1e293b;
      border-radius: 18px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
    }

    .compact-card .img-container {
      width: 100%;
      height: 180px;
      background: #000;
      overflow: hidden;
    }

    .compact-card .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-info { padding: 12px 14px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-info h3 { font-size: 14px; font-weight: 700; color: #0f172a; margin-bottom: 4px; line-height: 1.2; }

    .price-details { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
    .price-current { font-size: 18px; font-weight: 800; color: #0f172a; }
    .price-old { font-size: 12px; color: #94a3b8; text-decoration: line-through; margin-left: 4px; }
    .discount-tag { font-size: 11px; color: #64748b; }

    /* Action Row with Button and Selection Circle */
    .action-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-action {
      background: #ff5500;
      color: #ffffff;
      border: none;
      padding: 9px 12px;
      border-radius: 18px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      flex-grow: 1;
      text-align: center;
      text-decoration: none;
    }

    /* Selection Circle Box */
    .select-circle {
      width: 26px;
      height: 26px;
      border: 2px solid #cbd5e1;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .select-circle input { display: none; }
    .select-circle.checked {
      border-color: #ff5500;
      background: #ff5500;
    }
    .select-circle.checked::after {
      content: '✓';
      color: #fff;
      font-size: 12px;
      font-weight: bold;
    }

    /* Scroll Navigation Controls */
    .scroll-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
    }

    .nav-arrow {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid #ffffff;
      background: transparent;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
    }

    /* Modal Styling */
    .pay-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 10000; }
    .pay-modal.active { display: flex; }
    .pay-card { background: #1e293b; border: 1px solid #ff5500; padding: 20px; border-radius: 18px; width: 90%; max-width: 350px; text-align: center; color: #fff; }

    /* Mobile View Setup */
    @media (max-width: 768px) {
      .store-container { grid-template-columns: 1fr; gap: 20px; }
      .brand-sidebar { position: relative; top: 0; padding: 10px 0; }
      .brand-logo-img { width: 180px; }
      .brand-title { font-size: 20px; }
      .compact-card { min-width: 47%; max-width: 48%; }
      .multi-cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; overflow-x: visible; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <div class="top-bar">
    <a href="index.html" class="btn-back">← Back</a>
  </div>

  <div class="store-container">
    
    <!-- Branding Header Sidebar -->
    <aside class="brand-sidebar">
      <img src="assets/logo.png" alt="धर्मवीर ॲडव्हर्टायझिंग" class="brand-logo-img" onerror="this.src='https://via.placeholder.com/200?text=Logo'">
      <h1 class="brand-title">धर्मवीर ॲडव्हर्टायझिंग</h1>
      <p class="brand-subtitle">Premium PSD Templates</p>
    </aside>

    <!-- Products Content -->
    <main class="products-content" id="storeMain">
      <p style="text-align:center; padding: 30px; color:#94a3b8;">PSD Store लोड होत आहे...</p>
    </main>

  </div>

  <!-- QR Code Modal -->
  <div class="pay-modal" id="payModal">
    <div class="pay-card">
      <h3 id="payTitle" style="font-size:15px;">PSD Name</h3>
      <p style="margin:6px 0; color:#ff5500; font-weight:800; font-size: 22px;" id="payPrice">₹0</p>
      
      <div style="background:#fff; padding:8px; border-radius:10px; display:inline-block; margin: 4px 0;">
        <img id="qrImage" src="" style="width:160px; height:160px; display:block;">
      </div>
      
      <p style="font-size:11px; color:#94a3b8; margin:8px 0 4px;">QR कोड स्कॅन करा किंवा UPI ID कॉपी करा:</p>
      <button onclick="navigator.clipboard.writeText('9309860089@ybl'); alert('UPI ID कॉपी झाला!');" style="background:#0f172a; color:#fff; border:1px dashed #ff5500; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:12px; width: 100%;">Copy UPI: 9309860089@ybl</button>

      <a id="waLink" href="#" target="_blank" style="display:block; background:#25D366; color:#fff; padding:10px; border-radius:8px; text-decoration:none; font-weight:bold; margin-top:10px; font-size:13px;">WhatsApp वर स्क्रीनशॉट पाठवा →</a>
      <button onclick="document.getElementById('payModal').classList.remove('active')" style="background:transparent; color:#94a3b8; border:none; margin-top:8px; cursor:pointer; font-size:12px;">रद्द करा</button>
    </div>
  </div>

  <script>
    const waNum = "919309860089";
    const UPI_ID = "9309860089@ybl";

    async function fetchStoreData() {
      try {
        const res = await fetch('/api/psd-store');
        const data = await res.json();
        renderStore(data);
      } catch (e) {
        document.getElementById('storeMain').innerHTML = "<p style='text-align:center;'>डेटा लोड करण्यात अडचण आली.</p>";
      }
    }

    function renderStore(data) {
      const container = document.getElementById('storeMain');
      container.innerHTML = '';

      if (!data || data.length === 0) {
        container.innerHTML = "<p style='text-align:center; color:#94a3b8;'>सध्या कोणतीही PSD उपलब्ध नाही.</p>";
        return;
      }

      data.forEach((sec, idx) => {
        if (!sec.items || sec.items.length === 0) return;

        const secBlock = document.createElement('div');
        secBlock.className = 'section-block';

        const isSingle = sec.items.length === 1;

        let cardsHtml = sec.items.map(item => {
          const discount = item.originalPrice && Number(item.originalPrice) > Number(item.price)
            ? Math.round(((item.originalPrice - item.price) / item.originalPrice) * 100) + '%Off'
            : '';

          return `
            <div class="${isSingle ? 'single-card-banner' : 'compact-card'}">
              <div class="img-container" onclick="openPay('${escapeHtml(item.title)}', '${item.price}')">
                <img src="${item.previewImg}" alt="${item.title}" onerror="this.src='assets/logo.png'">
              </div>
              <div class="card-info">
                <div>
                  <h3>${escapeHtml(item.title)}</h3>
                  <div class="price-details">
                    <div>
                      <span class="price-current">₹${item.price}</span>
                      <span class="price-old">₹${item.originalPrice}</span>
                    </div>
                    ${discount ? `<span class="discount-tag">${discount}</span>` : ''}
                  </div>
                </div>
                <div class="action-row">
                  <button class="btn-action" onclick="openPay('${escapeHtml(item.title)}', '${item.price}')">Get it Now →</button>
                  <div class="select-circle" onclick="this.classList.toggle('checked')"></div>
                </div>
              </div>
            </div>
          `;
        }).join('');

        secBlock.innerHTML = `
          <div class="section-header">${escapeHtml(sec.sectionTitle)}</div>
          <div class="${isSingle ? '' : 'multi-cards-grid'}" id="scroll_grid_${idx}">${cardsHtml}</div>
          ${!isSingle ? `
            <div class="scroll-controls">
              <button class="nav-arrow" onclick="scrollGrid(${idx}, -200)">←</button>
              <button class="nav-arrow" onclick="scrollGrid(${idx}, 200)">→</button>
            </div>
          ` : ''}
        `;

        container.appendChild(secBlock);
      });
    }

    function scrollGrid(idx, dist) {
      const grid = document.getElementById(`scroll_grid_${idx}`);
      if(grid) grid.scrollBy({ left: dist, behavior: 'smooth' });
    }

    function openPay(title, price) {
      document.getElementById('payTitle').innerText = title;
      document.getElementById('payPrice').innerText = `₹${price}`;
      document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=${UPI_ID}%26pn=DharmveerAdvertising%26am=${price}%26cu=INR`;
      document.getElementById('waLink').href = `https://wa.me/${waNum}?text=${encodeURIComponent('नमस्कार, मी ' + title + ' (₹' + price + ') साठी पेमेंट केले आहे.')}`;
      document.getElementById('payModal').classList.add('active');
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    window.onload = fetchStoreData;
  </script>
</body>
</html>
